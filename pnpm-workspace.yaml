packages:
  - "apps/*"
  - "packages/*"

# Prisma needs its postinstall to fetch query engines; esbuild needs its binary.
# OpenSpec's postinstall only prints a shell-completion tip, so it stays off.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@fission-ai/openspec': false
  # BullMQ's msgpackr can use a native accelerator; it falls back to JavaScript without
  # one, and a native build on every teammate's machine is a worse trade than the speed.
  msgpackr-extract: false
