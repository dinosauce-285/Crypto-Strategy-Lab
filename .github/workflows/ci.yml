name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated rather than committed, so it has to exist
      # before anything typechecks. Generating needs no database.
      - run: pnpm db:generate

      # The same gate developers run locally: config validity, then lint, then build.
      - run: pnpm quality

  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # These run without installing anything — the maintenance scripts are stdlib
      # only, which is why they stay fast and cannot rot behind a dependency.
      - run: node .claude/scripts/validate-skill-frontmatter.cjs
      - run: node .claude/scripts/validate-agent-frontmatter.cjs
      - run: node .claude/scripts/regen-skill-index.cjs --check
      - run: node .claude/scripts/audit-claude-dir.cjs
