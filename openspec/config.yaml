schema: spec-driven-adr

context: |
  Crypto Strategy Lab — a laboratory for combining crypto trading strategies:
  plug in analysis methods, combine them automatically, backtest each combination,
  score it, rank it, repeat.

  What is graded is the architecture, not the returns. The measure is how many
  places have to change when a new strategy, a new search algorithm or a new
  exchange is added. One new file = good. Six edits across the system = bad.

  Stack: TypeScript end to end. NestJS API (apps/api), React + Vite web (apps/web),
  shared types in packages/contracts, PostgreSQL through Prisma 7, an in-process
  event bus for notification, BullMQ on Redis for work.

  Reasoning has one home: docs/decisions/. There is no design.md in this schema, and
  a change never argues a choice it could link to — the proposal's Decisions section
  lists what is settled and what this change must settle, and group 0 of tasks.md is
  writing that record with `pnpm decision "<the choice>"`. A spec says what the system
  does, a record says why it was chosen, a task says what to do next. Nothing belongs
  in two of them.

  Read AGENTS.md first — it is the canonical law and it wins over anything written
  here. Before touching apps/api read apps/api/docs/BACKEND_CONSTRAINT.md; before
  touching apps/web read apps/web/docs/UI_CONSTRAINT.md.

  Work is cut into 29 tasks (T01..T29) across 6 vertical slices, listed in
  docs/project-breakdown.html and mirrored on Trello. A change id is the branch name
  lowercased — branch T07-realtime-channel, change t07-realtime-channel — because
  OpenSpec requires kebab-case. One id ties the change, the branch, the Trello card
  and the commit scope together.

rules:
  proposal:
    - Name the task id (T01..T29) this change belongs to, and link its Trello card.
    - Cite the brief section that demands it, the way docs/project-breakdown.html does.
    - Fill both Decisions lines. Settled links the records this change builds on;
      To settle names the choice this change owes a record, or says there is none.
      Link, never restate — the argument lives in the record.
  tasks:
    - Group 0 is Decisions. One checkbox per record named under To settle, created
      with `pnpm decision "<the choice>"`, ordered before the code that assumes it.
      Nothing to settle is one ticked line saying so.
    - Keep strategy logic free of exchange calls, database access, frontend code and
      notifications. Keep business calculation out of React.
    - A task is not done when it builds. It is done when it runs — the endpoint is
      called, or the screen is opened and all four states produced.

operations:
  apply:
    guidance:
      - Run `pnpm lint` and `pnpm build` before calling anything done. Both, not one.
      - Commit with `pnpm commit`, never `git commit` — the bash guard blocks the latter.
      - "One command per shell call — the guard refuses `&&`, `||`, `;`, `|`, `<`, `>`."
      - A choice that only appears while implementing still belongs in docs/decisions/.
        Add it to group 0, run `pnpm decision "<the choice>"`, and write it before the
        code that assumes it rather than after the gate refuses the push.
  archive:
    guidance:
      - Before archiving, every box in group 0 is ticked and `pnpm decision --check`
        passes. A change that reached the end with an unwritten record is the one case
        where the reasoning is already gone.
